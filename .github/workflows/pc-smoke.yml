# Smoke test for the self-hosted PC runner (one job, fresh container, then gone).
# Triggers: push and workflow_dispatch only, never pull_request, so fork code never reaches the runner.
# It builds nothing from this repo.
name: pc smoke

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pc-smoke.yml

permissions:
  contents: read

concurrency:
  group: pc-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, pc-x86, container, cpp-utilities]
    timeout-minutes: 15
    steps:
      - name: Who and where
        run: |
          echo "user: $(id -un) uid $(id -u)"
          echo "slot: ${GHA_SLOT:-unset}  build jobs: ${GHA_SLOT_JOBS:-unset}  nproc: $(nproc)"
          uname -m
          grep -E '^PRETTY_NAME' /etc/os-release
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Repo tools from the slot cache
        run: |
          mise trust
          mise ls --current
          cmake --version | head -1
          ninja --version
      - name: Configure and build a throwaway project
        run: |
          d=$(mktemp -d)
          printf 'cmake_minimum_required(VERSION 3.28)\nproject(smoke CXX)\nadd_executable(smoke main.cpp)\n' > "$d/CMakeLists.txt"
          printf '#include <cstdio>\nint main() { std::puts("built on the PC runner"); }\n' > "$d/main.cpp"
          cmake -S "$d" -B "$d/build" -G Ninja
          cmake --build "$d/build"
          "$d/build/smoke"
